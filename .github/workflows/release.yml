name: Release Please

# IMPORTANT: Enable "Allow GitHub Actions to create and approve pull requests"
# in repository Settings → Actions → General
# OR use a Personal Access Token: token: ${{ secrets.RELEASE_TOKEN }}

on:
  push:
    branches:
      - main

concurrency:
  group: release-please-main
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write  # dispatch the publish workflow once a release is cut

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5
        id: release
        with:
          # Use PAT if GITHUB_TOKEN doesn't have PR creation permission
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: python

      # ──────────────────────────────────────────────────────────────────
      # Keep uv.lock in step with the version release-please just bumped.
      #
      # release-please edits pyproject.toml and CHANGELOG.md only, so merging
      # its PR untouched lands a main where pyproject says 1.11.3 and uv.lock
      # still says 1.11.2. Nothing fails at that moment — the cost is paid by
      # whoever commits next, because pre-commit runs `uv sync`, the lock is
      # rewritten underneath them, and the run aborts with "files were
      # modified by this hook" on a file they never touched. Patched by hand
      # for 1.11.1, 1.11.2 and 1.11.3 before this (#217).
      # ──────────────────────────────────────────────────────────────────
      # Parse the PR object here, in a step body, rather than in a `with:` or
      # `env:` expression.
      #
      # A step's inputs are evaluated even when its `if:` is false, so an
      # inline `fromJSON(steps.release.outputs.pr)` is evaluated on the
      # release-merge path too — where there is no PR and the output is the
      # empty string. fromJSON('') then fails template validation and kills
      # the whole job:
      #
      #   The template is not valid. release.yml (Line: 67, Col: 19):
      #   Error reading JToken from JsonReader.
      #
      # That took down the 1.11.4 release: the tag was cut, then the job died
      # before the publish dispatch below, so nothing reached PyPI. Reading
      # the raw string into an env var and parsing it with jq keeps every
      # expression here a plain string.
      #
      # The branch still comes from the action's own output rather than a
      # hand-built "release-please--branches--<base>", which would silently
      # stop matching if the base branch ever changed.
      # ──────────────────────────────────────────────────────────────────
      - name: Resolve the release PR branch
        id: release_pr
        if: steps.release.outputs.prs_created == 'true'
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          branch=$(printf '%s' "$PR_JSON" | jq -r '.headBranchName // empty')
          if [ -z "$branch" ]; then
            echo "::error::release-please reported a PR but no head branch name"
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Release PR branch: $branch"

      - name: Check out the release PR branch
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ steps.release_pr.outputs.branch }}
          # Full history and tags: the changelog-coverage check below walks
          # commits back to the previous release tag, which a shallow clone
          # would not contain.
          fetch-depth: 0

      - name: Install uv
        if: steps.release.outputs.prs_created == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: true

      - name: Sync uv.lock on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          BRANCH: ${{ steps.release_pr.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Resolves the whole graph, but the only entry that can move here is
          # ondine's own version — the dependency pins are already locked.
          uv lock

          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches the bumped version — nothing to do."
            exit 0
          fi

          git add uv.lock
          git commit -m "chore: sync uv.lock with the release version bump"

          # release-please recreates this branch whenever main moves, so it can
          # be rewritten under us mid-run. Losing that race is self-healing —
          # the push that caused it runs this job again — so it must not fail
          # the release.
          if ! git push origin "HEAD:$BRANCH"; then
            echo "::warning::Could not push the uv.lock sync — release-please most likely rewrote $BRANCH. The next run on main will redo this."
            exit 0
          fi
          echo "✅ uv.lock synced on $BRANCH"

      # ──────────────────────────────────────────────────────────────────
      # Hand off to the publish pipeline.
      #
      # This dispatch exists because neither the GitHub Release nor the tag
      # push that release-please performs can start a workflow on their own:
      # "events triggered by the GITHUB_TOKEN will not create a new workflow
      # run". The guard is about the token that raised the event, not the
      # event type, so `release: published` AND `push: tags` are both dead
      # ends here (see #190).
      #
      # workflow_dispatch is the documented exception — "workflow_dispatch
      # and repository_dispatch events always create workflow runs" — which
      # is why the handoff is an explicit dispatch rather than a trigger on
      # the publish side. It also lets us pass the exact tag release-please
      # cut, instead of inferring it after the fact.
      # ──────────────────────────────────────────────────────────────────
      # always(): the publish is the critical path and must not be hostage to
      # anything above it. The uv.lock sync failing — or, as in 1.11.4, merely
      # failing to *evaluate* — previously skipped this step and left a cut tag
      # with nothing on PyPI. Those steps are conveniences; this one is the
      # release.
      - name: Dispatch PyPI publish
        if: always() && steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A checkout only happens on the release-PR path above, so on this
          # path gh may have no git remote to infer the repo from — pass it.
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          # Through the environment rather than pasted into the script. This
          # workflow only runs on main, so the value is not attacker-supplied
          # today — but that is a property of the trigger, not of this line.
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "::error::release-please reported a release but gave no tag_name — refusing to publish an unknown version"
            exit 1
          fi
          echo "Dispatching 'Release to PyPI' for $TAG_NAME"
          gh workflow run publish-pypi.yml \
            --ref "$REF_NAME" \
            -f release_tag="$TAG_NAME"

      # ──────────────────────────────────────────────────────────────────
      # Last step on purpose: a changelog gap must be *visible*, but it must
      # never stop a release that is otherwise fine. Running after the
      # dispatch above means this can go red without having held anything up.
      #
      # release-please parses every commit as a conventional commit, and when
      # that parse fails it skips the commit, writes the changelog without it,
      # and still reports success. In 1.11.0 that swallowed #180 — the largest
      # feature in the release — because a body line contained nested parens
      # its grammar could not read. The version bump came from other commits,
      # so nothing else looked wrong (#191).
      # ──────────────────────────────────────────────────────────────────
      - name: Verify the changelog covers everything that shipped
        if: steps.release.outputs.prs_created == 'true'
        run: python scripts/check_changelog_coverage.py
