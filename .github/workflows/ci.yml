name: CI

on:
  push:
    branches: [ '**' ]  # Run on all branches
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job here reads the repo, runs tests and reports. None writes to the
# repository, comments on a PR, or uploads a SARIF, so the token they inherit
# should be able to do none of those either. Codecov authenticates with its own
# token, not this one.
permissions:
  contents: read

jobs:
  install-profiles:
    name: Install Profile (${{ matrix.profile }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        profile: [core, observability, all]

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.11'

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      with:
        enable-cache: true

    - name: Install maturin
      run: pip install maturin

    - name: Install package profile
      shell: bash
      # Use `uv pip install` so tool.uv.override-dependencies in pyproject.toml
      # is respected (raw pip ignores it and hits upstream transitive pin conflicts).
      run: |
        if [ "${{ matrix.profile }}" = "core" ]; then
          uv pip install --system .
        elif [ "${{ matrix.profile }}" = "observability" ]; then
          uv pip install --system ".[observability]"
        else
          uv pip install --system ".[all]"
        fi

    - name: Smoke test profile
      shell: bash
      run: |
        python -c "import ondine; print(ondine.__version__)"
        if [ "${{ matrix.profile }}" = "observability" ]; then
          python -c "from ondine.observability import disable_tracing, enable_tracing; enable_tracing(exporter='console'); disable_tracing()"
        elif [ "${{ matrix.profile }}" = "all" ]; then
          python -c "from ondine.observability import disable_tracing, enable_tracing; from ondine.utils.metrics_exporter import PrometheusMetrics; enable_tracing(exporter='console'); disable_tracing(); PrometheusMetrics(port=0)"
        fi

  bare-install-smoke:
    name: Bare Install Smoke
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.11'

    - name: Build wheel via maturin
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
      with:
        args: --release --out dist -i python3.11
        sccache: true

    # Bare first, then one extra. The bug class this job exists for — a core
    # dependency that is only declared in an extra — is *only* visible in the
    # bare leg; every extra installed can only hide it. The [mcp] leg is here
    # to catch extras-only import breakage cheaply. [all] is deliberately not
    # run: the Install Profile job above already proves it installs, and it
    # pulls torch via sentence-transformers for no extra detection power.
    - name: Smoke the public API on a bare install
      shell: bash
      run: |
        set -euo pipefail
        wheel=$(ls dist/*.whl | head -1)
        for extras in "" "[mcp]"; do
          echo "::group::install ondine${extras:-} (no dev environment)"
          rm -rf "${RUNNER_TEMP}/smokeenv"
          python -m venv "${RUNNER_TEMP}/smokeenv"
          "${RUNNER_TEMP}/smokeenv/bin/python" -m pip install --quiet --upgrade pip
          # Wheels only, and install the wheel by path: a source build would
          # need a toolchain users do not have, and resolving by name could
          # quietly pull the last release from PyPI instead of this commit.
          "${RUNNER_TEMP}/smokeenv/bin/python" -m pip install --quiet \
            --only-binary=:all: "${wheel}${extras}"
          "${RUNNER_TEMP}/smokeenv/bin/python" scripts/smoke_bare_install.py
          echo "::endgroup::"
        done

  # Quick checks for feature branches - runs on every push
  quick-check:
    name: Quick Check (Lint + Unit Tests)
    runs-on: ubuntu-latest
    # Only run on feature branches (not main/develop)
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.11'

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      with:
        enable-cache: true

    - name: Install dependencies + build Rust extension
      run: |
        uv sync --extra dev --extra observability --extra excel --extra parquet --extra knowledge
        uv pip install maturin
        uv run maturin develop

    - name: Run Rust tests
      run: cargo test -p ondine-core

    - name: Run linter
      run: |
        uv run ruff check .

    - name: Run formatter check
      run: |
        uv run ruff format --check .

    - name: Run unit tests only
      run: |
        uv run pytest tests/unit/ -v --tb=short

  # Full test suite for main/develop/PRs
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Run on main, develop, or PRs
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      with:
        enable-cache: true

    - name: Install dependencies + build Rust extension
      run: |
        uv sync --extra dev --extra observability --extra excel --extra parquet --extra knowledge
        uv pip install maturin
        uv run maturin develop

    - name: Run Rust tests
      run: cargo test -p ondine-core

    - name: Run linter
      run: |
        uv run ruff check .

    - name: Run type checker
      run: |
        uv run mypy ondine/

    - name: Run unit tests
      env:
        CUDA_VISIBLE_DEVICES: ""
        PYTORCH_MPS_HIGH_WATERMARK_RATIO: "0.0"
      run: |
        uv run pytest tests/unit/ -v --tb=short

    # ──────────────────────────────────────────────────────────────────
    # Runs on every PR, unlike the integration suite below, because this is
    # the suite that catches silent data loss — a run that finishes green
    # with rows dropped, duplicated or misaligned. It needs no API key and
    # no network: the provider is a local fake that answers from the prompt's
    # own content, so every row's answer is checkable by value.
    #
    # Kept out of tests/unit/ because it drives the real executor,
    # checkpointer and cost tracker end to end, and out of the main-only
    # integration job because a regression here must block the PR that
    # introduces it, not surface after merge.
    # ──────────────────────────────────────────────────────────────────
    - name: Run pipeline conformance suite
      run: |
        uv run pytest tests/e2e/test_pipeline_conformance.py -v --tb=short

    - name: Run integration tests (main branch only)
      if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        uv run pytest tests/integration/ -v --tb=short

    - name: Run all tests with coverage
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        uv run pytest --cov=ondine --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  # Verify compatibility with pandas 1.5.x (minimum supported version)
  test-pandas-compat:
    name: Test pandas 1.5 compatibility
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Set up Python 3.11
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.11'

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      with:
        enable-cache: true

    - name: Install with pandas 1.5 + build Rust extension
      run: |
        uv sync --extra dev --extra excel --extra parquet --extra knowledge
        uv pip install maturin
        uv run maturin develop
        uv pip install "pandas==1.5.3" "numpy<1.24" --force-reinstall

    - name: Verify pandas version
      run: |
        uv run --no-sync python -c "import pandas; print(f'pandas {pandas.__version__}'); assert pandas.__version__.startswith('1.5'), f'Expected pandas 1.5.x, got {pandas.__version__}'"

    - name: Run unit tests (skip observability — unrelated to pandas compat)
      run: |
        uv run --no-sync pytest tests/unit/ -v --tb=short -o addopts="" --ignore=tests/unit/test_observability.py

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # Only run on main/develop/PRs
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run security scan
      # GHSA-w8v5-vhqr-4h9v: diskcache — no upstream fix
      # PYSEC-2022-42969: py (legacy pytest dep) — abandoned, no fix
      # GHSA-58qw-9mgm-455v: pip itself — no released fix version
      # GHSA-69w3-r845-3855: transformers Trainer RCE — fix only in 5.0.0rc3 prerelease;
      #                     ondine does not use Trainer (embedding/tokenization only)
      run: |
        uv run pip-audit \
          --ignore-vuln GHSA-w8v5-vhqr-4h9v \
          --ignore-vuln PYSEC-2022-42969 \
          --ignore-vuln GHSA-58qw-9mgm-455v \
          --ignore-vuln GHSA-69w3-r845-3855

  claim-verification:
    name: Claim Verification Suite
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.11'

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      with:
        enable-cache: true

    - name: Install dependencies + build Rust extension
      run: |
        uv sync --extra dev --extra observability --extra excel --extra parquet --extra knowledge
        uv pip install maturin
        uv run maturin develop

    - name: Run claim verification tests
      run: |
        uv run pytest tests/verification/ -v --tb=short -o addopts=""

    - name: Verify all 83 claims have tests
      run: |
        uv run python tools/verify_claims_coverage.py

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [install-profiles, bare-install-smoke, test, test-pandas-compat]
    # Only run on main/develop/PRs
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.11'

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2

    - name: Install maturin
      run: pip install maturin

    - name: Build package
      run: |
        maturin build --release

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: dist
        path: target/wheels/
