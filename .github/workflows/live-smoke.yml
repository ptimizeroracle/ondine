name: Live Smoke

# A few real provider calls a day against the *published* package, installed
# the way a new user installs it: latest release, dependencies resolved fresh,
# no lock file. It exists to notice what no other check can:
#
#   - a provider retiring a model the docs recommend,
#   - a provider changing its API,
#   - a new release of a dependency (LiteLLM, Instructor, Pydantic) breaking
#     the last ondine release for everyone who installs it today.
#
# The rest of CI runs against fakes, and has no API keys, so it stays green
# through all three.

on:
  schedule:
    - cron: '17 6 * * *'  # Daily, off the hour to avoid the scheduler's busiest minute
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Published package against live providers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'

    # From PyPI, not from this checkout: the point is to test what users get.
    - name: Install the published package
      run: |
        python -m pip install --upgrade pip
        python -m pip install ondine pytest
        python -m pip list | grep -iE "^(ondine|litellm|instructor|pydantic|openai) "

    # Run from a directory that holds only the smoke test and the model names
    # it needs. In the checkout, "import ondine" would resolve to the source
    # tree (which has no compiled engine) instead of the installed wheel.
    - name: Run the smoke test
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # Providers that must be exercised. A missing key for one of these
        # fails the run instead of skipping it: a smoke test that skips itself
        # green is exactly the gap this workflow closes. Add "openai" here
        # once an OPENAI_API_KEY secret exists.
        ONDINE_LIVE_REQUIRED: groq
      run: |
        mkdir -p "${RUNNER_TEMP}/smoke/tests/integration"
        cp tests/integration/live_models.py tests/integration/test_live_smoke.py \
          "${RUNNER_TEMP}/smoke/tests/integration/"
        cd "${RUNNER_TEMP}/smoke"
        python -m pytest tests/integration/test_live_smoke.py -v --tb=short -p no:cacheprovider

  # A scheduled failure reaches nobody on its own; this job files it as an
  # issue. See .github/scripts/report-scheduled-failure.sh.
  report:
    name: Report failure
    needs: smoke
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Open or update the failure issue
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        WORKFLOW_NAME: Live Smoke
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: .github/scripts/report-scheduled-failure.sh
