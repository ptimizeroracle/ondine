name: Release to PyPI

# ──────────────────────────────────────────────────────────────────────────
# Publishing pipeline:
#   resolve-tag → build-sdist  ┐
#                              ├─► verify-matrix-complete (16 wheels gate)
#                 build-wheels ┘                 ↓
#                                          publish-testpypi
#                                                ↓
#                                          smoke-test (6 runners, fresh pip install)
#                                                ↓
#                                          publish-prod (Sigstore-signed)
#
# The smoke-test job installs from TestPyPI on macOS arm64, macOS x86_64,
# Windows, and Linux arm64 WITHOUT any Rust toolchain present. If any
# wheel is missing, pip tries to build from sdist, fails, and blocks the
# prod publish. This catches the regression class from v1.7.0-v1.9.1 where
# only Linux x86_64 Python 3.11 wheels were published.
# ──────────────────────────────────────────────────────────────────────────

on:
  # workflow_dispatch is the PRIMARY trigger for automated releases: the
  # Release Please workflow dispatches this one with the tag it just cut
  # (see .github/workflows/release.yml).
  #
  # It has to be a dispatch. release-please pushes the tag and creates the
  # GitHub Release with GITHUB_TOKEN, and "events triggered by the
  # GITHUB_TOKEN will not create a new workflow run" — that guard keys off
  # the token that raised the event, NOT the event type, so `release:
  # published` and `push: tags` are BOTH inert for an automated release.
  # #196 added the tag trigger on the mistaken belief that tag pushes were
  # exempt; v1.11.1 proved they are not. workflow_dispatch is the documented
  # exception: it "always creates workflow runs" even from GITHUB_TOKEN.
  #
  # The two triggers below remain for humans (a hand-pushed tag or a
  # hand-published release). They cannot double-publish alongside the
  # dispatch: concurrency serialises the runs and every upload step sets
  # skip-existing: true.
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (e.g. v1.10.0)"
        required: true
        type: string

concurrency:
  group: publish-pypi
  cancel-in-progress: false

# Read-only for the workflow; the one job that needs to sign asks for the
# OIDC token itself. Every other job here builds, downloads artifacts and
# uploads to an index with its own credential — none of them touch the repo.
#
# `contents: write` was granted workflow-wide for signatures that are attached
# to build artifacts, not to a GitHub release, so nothing ever used it.
permissions:
  contents: read

jobs:

  # ────────────────────────────────────────────────────────────────────
  # 1. Resolve release tag and verify it matches pyproject.toml version
  # ────────────────────────────────────────────────────────────────────
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
    steps:
      # Resolve the tag BEFORE checkout. Each trigger carries it somewhere
      # different and exactly one source is populated per run, so read the
      # one that matches the event rather than coalescing them — a fallback
      # chain would happily resolve a dispatch with a missing input to
      # "main" and publish whatever HEAD happens to be.
      - id: r
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch) TAG="$INPUT_TAG" ;;
            release)           TAG="$RELEASE_TAG" ;;
            push)
              if [ "$REF_TYPE" != "tag" ]; then
                echo "::error::push trigger fired for a $REF_TYPE, not a tag — refusing to publish"
                exit 1
              fi
              TAG="$REF_NAME"
              ;;
            *)
              echo "::error::Unsupported trigger '$EVENT_NAME' — cannot determine a release tag"
              exit 1
              ;;
          esac
          if [ -z "$TAG" ]; then
            echo "::error::No release tag available for event '$EVENT_NAME' — refusing to publish an ambiguous version"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "::error::Expected SemVer tag starting with v, got: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag $TAG from event '$EVENT_NAME'"

      # The dispatch from release.yml lands moments after release-please
      # pushes the tag, so give the ref a brief window to become visible
      # before checkout turns a propagation blip into a failed release.
      - name: Await tag ref
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.r.outputs.tag }}
        run: |
          for i in 1 2 3 4 5 6; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag $TAG exists"
              exit 0
            fi
            echo "Tag $TAG not visible yet (attempt $i) — waiting 10s"
            sleep 10
          done
          echo "::error::Tag $TAG does not exist in ${GITHUB_REPOSITORY} — refusing to publish"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.r.outputs.tag }}

      - name: Verify tag matches pyproject.toml version
        shell: bash
        env:
          # Interpolated through the environment, not into the script text.
          # These values are validated upstream, but a run: block that pastes
          # ${{ }} directly is one relaxed regex away from shell injection.
          TAG: ${{ steps.r.outputs.tag }}
          VERSION: ${{ steps.r.outputs.version }}
        run: |
          PACKAGE_VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version ($VERSION) != pyproject.toml version ($PACKAGE_VERSION)"
            exit 1
          fi
          echo "✅ Tag $TAG / version $VERSION"

  # ────────────────────────────────────────────────────────────────────
  # 2. Source distribution (one tarball)
  # ────────────────────────────────────────────────────────────────────
  build-sdist:
    needs: resolve-tag
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 90
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────
  # 3. Binary wheels — 4 platforms × 4 Python = 16 wheels (Mac is universal2)
  # ────────────────────────────────────────────────────────────────────
  build-wheels:
    needs: resolve-tag
    name: Wheel ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          - os: macos-14
            target: universal2-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel via maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python${{ matrix.python }}
          manylinux: ${{ matrix.manylinux || '' }}
          # No compiler cache on the wheels that go to PyPI. A cache is
          # writable by any job on any branch, so a poisoned entry can end up
          # compiled into a published artifact — and these are the artifacts
          # users install. 16 wheels built from cold is a few minutes on a
          # workflow that runs once per release.
          sccache: false

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl
          retention-days: 90
          if-no-files-found: error

      - name: Self-test wheel — Rust extension imports
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          PYTHONIOENCODING: utf-8
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links "$GITHUB_WORKSPACE/dist" "ondine==${VERSION}"
          python -c "
          from ondine._engine import EvidenceDB
          db = EvidenceDB(':memory:')
          print('OK ondine._engine loads on ${{ matrix.os }} py${{ matrix.python }}')
          "

  # ────────────────────────────────────────────────────────────────────
  # 4. Matrix completeness gate — block if any wheel silently dropped
  # ────────────────────────────────────────────────────────────────────
  verify-matrix-complete:
    needs: [build-sdist, build-wheels]
    name: Verify 16 wheels + 1 sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: sdist
          path: dist
      - name: Assert artifact counts
        run: |
          WHEEL_COUNT=$(find dist -name '*.whl' | wc -l | tr -d ' ')
          SDIST_COUNT=$(find dist -name '*.tar.gz' | wc -l | tr -d ' ')
          echo "────────────────────────────────────────"
          ls -la dist/
          echo "────────────────────────────────────────"
          echo "Wheels: $WHEEL_COUNT  (expected 16)"
          echo "Sdist:  $SDIST_COUNT  (expected 1)"
          if [ "$WHEEL_COUNT" -ne 16 ]; then
            echo "::error::Matrix incomplete — expected exactly 16 wheels, got $WHEEL_COUNT"
            exit 1
          fi
          if [ "$SDIST_COUNT" -ne 1 ]; then
            echo "::error::Expected 1 sdist, got $SDIST_COUNT"
            exit 1
          fi
          echo "✅ 16 wheels + 1 sdist present"

  # ────────────────────────────────────────────────────────────────────
  # 5. Upload to TestPyPI as smoke-test target
  # ────────────────────────────────────────────────────────────────────
  publish-testpypi:
    needs: [resolve-tag, verify-matrix-complete]
    name: Upload to TestPyPI
    runs-on: ubuntu-latest
    environment: Ondine
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      # sdist intentionally skipped: TestPyPI smoke-test uses --only-binary,
      # so only wheels matter. Prod publish uploads both.
      - name: Upload wheels to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true

  # ────────────────────────────────────────────────────────────────────
  # 6. Smoke test — install from TestPyPI on platforms that were broken
  #    in v1.7.0-v1.9.1. These runners have NO Rust toolchain, so if a
  #    wheel is missing, pip falls back to sdist and fails to build.
  # ────────────────────────────────────────────────────────────────────
  smoke-test:
    needs: [resolve-tag, publish-testpypi]
    name: Smoke ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,         python: "3.10" }
          - { os: macos-14,         python: "3.12" }
          - { os: macos-14,         python: "3.13" }
          - { os: windows-latest,   python: "3.10" }
          - { os: windows-latest,   python: "3.13" }
          - { os: ubuntu-24.04-arm, python: "3.11" }
          - { os: ubuntu-24.04-arm, python: "3.12" }
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install from TestPyPI (wheel-only, no source fallback)
        shell: bash
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          python -m pip install --upgrade pip packaging
          # --only-binary ondine: refuses sdist fallback, errors hard if no wheel
          # --extra-index-url prod PyPI: dependencies come from prod, package itself from test
          #
          # "No matching distribution found" has two causes that need opposite
          # responses, and pip cannot tell them apart:
          #
          #   * this runner reached a stale TestPyPI CDN edge while the wheel is
          #     uploaded and compatible — harmless, must not block the release
          #   * no uploaded wheel matches this interpreter — the v1.7.0-v1.9.1
          #     regression this job exists to catch, must block the release
          #
          # Waiting longer cannot separate them. In 1.11.3 the lag outlived the
          # ~3m45s window from #197 and blocked a perfectly good release *after*
          # its tag was cut, while all 16 wheels sat on TestPyPI (#215). So:
          # retry longer, then ask the JSON API — authoritative about what was
          # uploaded, and updated ahead of the simple index — whether a wheel
          # matching *this* runner exists.
          #
          # Any other pip failure (a broken wheel, a missing dependency, an ABI
          # mismatch) is a real defect that waiting cannot fix, so it still
          # fails immediately instead of burning the window and masking itself.
          BACKOFF=(15 30 60 60 60 90 120)
          LAST=${#BACKOFF[@]}
          for i in $(seq 0 "$LAST"); do
            if OUTPUT=$(python -m pip install \
                --index-url https://test.pypi.org/simple/ \
                --extra-index-url https://pypi.org/simple/ \
                --only-binary ondine \
                "ondine==${VERSION}" 2>&1); then
              echo "$OUTPUT"
              echo "✅ Installed ondine==${VERSION} on attempt $((i + 1))"
              exit 0
            fi
            echo "$OUTPUT"
            if ! echo "$OUTPUT" | grep -qE "No matching distribution found|Could not find a version that satisfies"; then
              echo "::error::pip failed for a reason other than TestPyPI index lag — not retrying"
              exit 1
            fi
            if [ "$i" -lt "$LAST" ]; then
              echo "Attempt $((i + 1)) hit TestPyPI index lag — retrying in ${BACKOFF[$i]}s"
              sleep "${BACKOFF[$i]}"
            fi
          done

          echo "Retries exhausted (~7m15s). Asking the JSON API what was actually uploaded."
          STATUS=$(python - <<'PY'
          import json, os, urllib.error, urllib.request

          from packaging.tags import sys_tags
          from packaging.utils import parse_wheel_filename

          url = f"https://test.pypi.org/pypi/ondine/{os.environ['VERSION']}/json"
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              print("absent" if exc.code == 404 else "unreachable")
              raise SystemExit(0)
          except Exception:
              print("unreachable")
              raise SystemExit(0)

          wheels = [
              f["filename"]
              for f in payload.get("urls", [])
              if f.get("filename", "").endswith(".whl")
          ]
          if not wheels:
              print("absent")
              raise SystemExit(0)

          supported = {str(tag) for tag in sys_tags()}
          for filename in wheels:
              try:
                  _, _, _, tags = parse_wheel_filename(filename)
              except Exception:
                  continue  # an unparseable filename tells us nothing
              if any(str(tag) in supported for tag in tags):
                  print("compatible")
                  break
          else:
              print("incompatible")
          PY
          )

          case "$STATUS" in
            compatible)
              # The upload is complete and this platform's wheel is there; only
              # this CDN edge is behind. Production publish uploads the build
              # artifacts directly, never TestPyPI, so the released files are
              # unaffected by a stale test index.
              #
              # Nothing got installed, so the steps below fall back to the
              # built wheel instead of skipping. A stale edge must not turn
              # into an unverified platform: the artifact answers the question
              # this gate actually asks — does this wheel install without a
              # Rust toolchain, and does its extension load (#226).
              echo "::warning::ondine==${VERSION} is uploaded to TestPyPI with a wheel matching this runner, but the index edge served to this job is still stale after ~7m15s. Falling back to the built wheel for verification (#215, #226)."
              echo "smoke_from_artifact=true" >> "$GITHUB_ENV"
              exit 0
              ;;
            incompatible)
              echo "::error::TestPyPI has ondine==${VERSION} but no wheel matching this runner ($(python -c 'import platform,sys;print(platform.platform(), "py%d.%d" % sys.version_info[:2])')). This is the v1.7.0 wheel regression — refusing to publish."
              exit 1
              ;;
            absent)
              echo "::error::TestPyPI has no wheels for ondine==${VERSION} — the upload did not land. Refusing to publish."
              exit 1
              ;;
            *)
              echo "::error::Could not reach the TestPyPI JSON API to tell index lag from a missing wheel. Failing closed."
              exit 1
              ;;
          esac

      # Fallback target when TestPyPI's index was stale. verify-matrix-complete
      # has already proved these 16 wheels exist and publish-prod uploads these
      # same files, so installing one here tests exactly what ships.
      - name: Download built wheels (fallback verification target)
        if: env.smoke_from_artifact == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Install the built wheel for this runner
        if: env.smoke_from_artifact == 'true'
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(python - <<'PY'
          import glob
          import os

          from packaging.tags import sys_tags
          from packaging.utils import parse_wheel_filename

          supported = {str(tag) for tag in sys_tags()}
          for path in sorted(glob.glob(os.path.join("dist", "*.whl"))):
              try:
                  _, _, _, tags = parse_wheel_filename(os.path.basename(path))
              except Exception:
                  continue
              if any(str(tag) in supported for tag in tags):
                  print(path)
                  break
          PY
          )
          if [ -z "$wheel" ]; then
            echo "::error::No built wheel matches this runner — the build matrix is missing this platform, which is the v1.7.0 regression."
            exit 1
          fi
          echo "Installing $wheel"
          python -m pip install "$wheel"

      # Always runs. Whether the wheel came from TestPyPI or from the build
      # artifact, this is the assertion the gate exists to make.
      - name: Verify Rust extension loads (regression gate)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "
          from ondine._engine import EvidenceDB
          db = EvidenceDB(':memory:')
          print('OK ${{ matrix.os }} py${{ matrix.python }}: wheel installed + Rust extension works')
          "

  # ────────────────────────────────────────────────────────────────────
  # 7. Production publish — Sigstore-sign, upload to PyPI
  # ────────────────────────────────────────────────────────────────────
  publish-prod:
    needs: [resolve-tag, smoke-test]
    name: Publish to PyPI (production)
    runs-on: ubuntu-latest
    environment: Ondine
    permissions:
      contents: read
      id-token: write  # Sigstore signing via OIDC
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: sdist
          path: dist

      - name: List artifacts
        run: ls -la dist/

      - name: Validate long_description with twine
        run: |
          python -m pip install --upgrade twine
          twine check --strict dist/*

      - name: Sign wheels + sdist with Sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1  # v3.4.0
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz

      - name: Move sigstore bundles out of upload dir
        run: |
          mkdir -p signatures
          mv dist/*.sigstore.json signatures/ || true
          ls -la dist/ signatures/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true

      - name: Restore sigstore bundles for archive
        run: mv signatures/*.sigstore.json dist/ || true

      - name: Archive signed release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: signed-release-${{ needs.resolve-tag.outputs.version }}
          path: dist/
          retention-days: 365
