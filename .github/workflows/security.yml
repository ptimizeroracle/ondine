name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday

# Scanners and auditors: they read the tree and fail the job. Nothing here
# uploads a SARIF or writes a check, so nothing needs write.
permissions:
  contents: read

jobs:
  workflow-audit:
    name: Workflow Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

    # Guards the class that broke the v1.8.0 and v1.8.1 publishes: an action
    # referenced by floating tag stopped resolving when upstream withdrew the
    # alias, and the release was blocked for hours. A floating tag can also
    # silently move to a compromised release.
    #
    # --offline keeps this from depending on GitHub API availability; the
    # pinning and injection rules are static checks and need no network.
    # Rules deliberately not enforced yet are listed in .github/zizmor.yml
    # with the reason for each.
    - name: Audit workflows (zizmor)
      run: uvx zizmor --persona=regular --offline --config .github/zizmor.yml .github/workflows/

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run pip-audit (vulnerability scanner)
      # GHSA-w8v5-vhqr-4h9v: diskcache — no upstream fix
      # PYSEC-2022-42969: py (legacy pytest dep) — abandoned, no fix
      # GHSA-58qw-9mgm-455v: pip itself — no released fix version
      # GHSA-69w3-r845-3855: transformers Trainer RCE — fix only in 5.0.0rc3 prerelease;
      #                     ondine does not use Trainer (embedding/tokenization only)
      run: |
        uv run pip-audit --desc \
          --ignore-vuln GHSA-w8v5-vhqr-4h9v \
          --ignore-vuln PYSEC-2022-42969 \
          --ignore-vuln GHSA-58qw-9mgm-455v \
          --ignore-vuln GHSA-69w3-r845-3855

  code-scan:
    name: Code Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run bandit security scan
      run: |
        uv run bandit -r ondine/ -c pyproject.toml

  secrets-scan:
    name: Scan for Leaked Secrets
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: TruffleHog OSS
      uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11  # v3.96.0
      with:
        path: ./
        extra_args: --only-verified

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Check licenses
      run: |
        uv run pip-licenses --format=markdown

  # A scheduled failure reaches nobody on its own; this job files it as an
  # issue. See .github/scripts/report-scheduled-failure.sh.
  report:
    name: Report failure
    needs: [workflow-audit, dependency-scan, code-scan, secrets-scan, license-check]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Open or update the failure issue
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        WORKFLOW_NAME: Security Scanning
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: .github/scripts/report-scheduled-failure.sh
