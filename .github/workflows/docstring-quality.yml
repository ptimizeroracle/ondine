name: Docstring Quality Check

on:
  pull_request:
    paths:
      - 'ondine/**/*.py'
  push:
    branches:
      - main
    paths:
      - 'ondine/**/*.py'

permissions:
  contents: read

jobs:
  check-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Check docstring coverage
        run: |
          uv run python tools/check_docstring_coverage.py

      - name: Generate quality report
        run: |
          uv run python tools/generate_docstring_report.py

      - name: Check with interrogate
        run: |
          uv run interrogate ondine/ --fail-under=80 -v

      - name: Report results
        if: failure()
        run: |
          echo "❌ Docstring quality check failed!"
          echo "Coverage dropped below 80% or quality issues detected."
          exit 1
