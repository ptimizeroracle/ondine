name: Docstring Quality Check

on:
  pull_request:
    paths:
      - 'ondine/**/*.py'
  push:
    branches:
      - main
    paths:
      - 'ondine/**/*.py'

permissions:
  contents: read

jobs:
  check-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Check docstring coverage
        run: |
          uv run python tools/check_docstring_coverage.py

      - name: Generate quality report
        run: |
          uv run python tools/generate_docstring_report.py

      - name: Check with interrogate
        run: |
          uv run interrogate ondine/ --fail-under=80 -v

      - name: Report results
        if: failure()
        run: |
          echo "❌ Docstring quality check failed!"
          echo "Coverage dropped below 80% or quality issues detected."
          exit 1
