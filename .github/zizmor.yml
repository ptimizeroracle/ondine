# zizmor configuration — https://docs.zizmor.sh/configuration/
#
# CI fails on anything not listed here, which is the point: the two classes
# already fixed (unpinned actions, template injection) cannot come back
# unnoticed. A floating action tag is what broke the v1.8.0 and v1.8.1
# publishes when upstream stopped publishing the alias (#149).
#
# The rules below are switched off deliberately, not because they are wrong.
# Each needs per-workflow analysis rather than a sweep, and turning them on
# without doing that work would only teach everyone to ignore a red check.
rules:
  # 18 findings. actions/checkout leaves the token in .git/config, so any
  # later step — including third-party actions — can read it. Fixing means
  # auditing which jobs actually need to push and setting
  # persist-credentials: false everywhere else. Tracked separately.
  artipacked:
    ignore:
      - "ci.yml"
      - "docstring-quality.yml"
      - "publish-pypi.yml"
      - "release.yml"
      - "security.yml"
      - "validate-docs.yml"

  # 18 findings. Several jobs inherit broader GITHUB_TOKEN permissions than
  # they use. Narrowing them requires knowing what each job genuinely needs;
  # guessing risks breaking releases, which is the one thing worth not
  # breaking. Tracked separately.
  excessive-permissions:
    ignore:
      - "ci.yml"
      - "docstring-quality.yml"
      - "publish-pypi.yml"
      - "release.yml"
      - "security.yml"
      - "validate-docs.yml"

  # 2 findings. Trusted publishing would remove the long-lived PyPI token
  # entirely. A real improvement, and a change to how releases authenticate —
  # not something to fold into a lint PR.
  use-trusted-publishing:
    ignore:
      - "ci.yml"
      - "docstring-quality.yml"
      - "publish-pypi.yml"
      - "release.yml"
      - "security.yml"
      - "validate-docs.yml"

  # 2 findings. Cache restore before a build step can in principle poison the
  # artifact. Low risk here (caches are per-branch and the wheels are rebuilt
  # from a tag), but worth revisiting.
  cache-poisoning:
    ignore:
      - "ci.yml"
      - "docstring-quality.yml"
      - "publish-pypi.yml"
      - "release.yml"
      - "security.yml"
      - "validate-docs.yml"
