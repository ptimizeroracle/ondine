# Example: Config-driven pipeline with Groq (free tier, very fast inference)
#
# Run a whole pipeline from YAML — no Python required:
#
#   export GROQ_API_KEY="gsk_..."
#   ondine process --config examples/groq_config.yaml
#
# Preview cost and token counts first, without calling the API or spending
# anything (no API key needed for a dry run):
#
#   ondine process --config examples/groq_config.yaml --dry-run

name: "sentiment_classification_groq"
version: "1.0"

dataset:
  source_type: csv
  source_path: examples/sample_data.csv
  input_columns:
    - text
  output_columns:
    - sentiment

prompt:
  template: |
    Classify the sentiment of the following text.
    Respond with only one word: positive, negative, or neutral.

    Text: {text}

    Sentiment:
  system_message: "You are a precise sentiment classifier."

llm:
  provider: groq
  model: llama-3.3-70b-versatile
  # api_key omitted on purpose — read from GROQ_API_KEY.
  temperature: 0.0
  max_tokens: 10

processing:
  batch_size: 20
  concurrency: 5
  error_policy: skip
  rate_limit_rpm: 30  # Groq's free tier is generous but rate limited

output:
  destination_type: csv
  destination_path: examples/groq_output.csv
  merge_strategy: replace
