[project]
name = "ondine"
version = "1.10.1"
description = "Batch-process your DataFrames with LLMs, without the boilerplate."
requires-python = ">=3.10"
authors = [
    {name = "Binblok", email = "git@binblok.com"}
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["agents", "agent-evaluation", "synthetic-data", "data-enrichment", "batch-inference", "structured-output", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core LLM integration (using LiteLLM native + Instructor)
    "litellm>=1.91.1",
    "instructor>=1.15.4",
    "diskcache>=5.6.0", # For LiteLLM Disk caching
    "aiohttp>=3.14.1", # For high-performance connection pooling
    # Data processing
    "pandas>=2.3.3",
    "polars>=1.42.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "tqdm>=4.68.4",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    "structlog>=26.1.0",
    "jinja2>=3.1.0",
    "click>=8.4.2",
    "rich>=13.7.0",  # instructor 1.15.4 caps rich<15.0.0
    "anthropic>=0.116.0",
]

[project.urls]
Homepage = "https://ondine.dev"
Repository = "https://github.com/ptimizeroracle/ondine"
Documentation = "https://docs.ondine.dev"
Issues = "https://github.com/ptimizeroracle/ondine/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
    "mypy>=2.2.0",
    "types-PyYAML>=6.0.12",  # stubs for yaml; silences import-untyped in mcp/ + intent/
    "pre-commit>=4.6.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5",
    "ipython>=8.39.0",
    "jupyter>=1.0.0",
    "pydocstyle>=6.3.0",
    "interrogate>=1.7.0",
]
redis = [
    "redis>=5.0.0",
]
excel = [
    "openpyxl>=3.1.0",
]
parquet = [
    "pyarrow>=15.0.0",
]
tui = [
    "textual>=1.0.0",
]
performance = [
    "uvloop>=0.19.0; sys_platform != 'win32'",
]
llama-index = [
    "llama-index>=0.12.0",
]
mlx = [
    "mlx>=0.29.0",
    "mlx-lm>=0.28.0",
]
knowledge = [
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
]
zep = [
    "zep-cloud>=2.0",
]
azure = [
    "azure-identity>=1.15.0",
]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "deprecated>=1.2.0",
    "langfuse>=2.0.0",
    "prometheus-client>=0.25.0",
]
all = [
    "redis>=5.0.0",
    "openpyxl>=3.1.0",
    "pyarrow>=15.0.0",
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "llama-index>=0.12.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "deprecated>=1.2.0",
    "langfuse>=2.0.0",
    "prometheus-client>=0.25.0",
    "mlx>=0.29.0",
    "mlx-lm>=0.28.0",
    "azure-identity>=1.15.0",
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
]

[project.scripts]
ondine = "ondine.cli.main:cli"
hermes = "ondine.cli.main:cli"  # Keep backward compatibility alias

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "ondine._engine"
manifest-path = "crates/ondine-python/Cargo.toml"
python-source = "."
include = [{ path = "LICENSE", format = "sdist" }, { path = "README.md", format = "sdist" }]

# Ruff configuration (replaces black, isort, flake8, etc.)
[tool.ruff]
line-length = 88  # Standard Python (PEP 8 recommends 79 but 88 is modern default)
target-version = "py310"
extend-exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "B",      # flake8-bugbear
    "C90",    # mccabe complexity
    "UP",     # pyupgrade
    "S",      # bandit security
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top (intentional for env setup)
    "S101",   # use of assert (fine in tests)
    "S108",   # hardcoded /tmp usage (fine for examples)
    "S301",   # pickle usage (needed for checkpoints)
    "S110",   # try-except-pass (intentional for observers)
    "S112",   # try-except-continue (intentional error handling)
    "T201",   # print statements (needed for CLI/examples)
    "B007",   # unused loop variable (common in pandas iterrows)
    "B017",   # pytest.raises(Exception) (acceptable in tests)
    "B027",   # empty abstract method without decorator (optional hooks)
    "B904",   # raise within except without from (acceptable)
    "C901",   # too complex (acceptable for main execute functions)
    "PT011",  # pytest.raises too broad (acceptable)
    "SIM105", # contextlib.suppress suggestion (readability preference)
    "SIM108", # ternary operator suggestion (readability preference)
    "SIM102", # nested if simplification (readability preference)
    "S603",   # subprocess without shell=True
    "S607",   # starting process with partial path
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "PLR0913"]
"examples/**/*.py" = ["T201", "S105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradually enable
check_untyped_defs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101"]  # assert_used - fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "benchmark: marks tests as performance benchmarks (run with '--benchmark-only')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::RuntimeWarning",
]

[tool.pydocstyle]
convention = "google"
add_ignore = ["D100", "D104"]  # Don't require docstrings for __init__.py files
match = "(?!test_).*\\.py"  # Exclude test files
match_dir = "^(?!tests|build|dist|\\.)"  # Exclude test/build directories

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-module = false
ignore-nested-functions = true
ignore-private = true
ignore-property-decorators = true
ignore-semiprivate = true
fail-under = 80  # Require 80% docstring coverage
exclude = ["tests", "build", "dist"]
verbose = 1

[tool.uv]
# Force minimum safe versions for transitive dependencies flagged by pip-audit
override-dependencies = [
    "filelock>=3.20.3",
    "nbconvert>=7.17.0",
    "pygments>=2.20.0",
    "requests>=2.33.0",
    "tornado>=6.5.5",
    "urllib3>=2.6.3",
    "virtualenv>=20.36.1",
    "pip>=25.3",
    # litellm 1.83.13 hard-pins older transitives with known CVEs.
    # Override until litellm relaxes the pins upstream.
    "aiohttp>=3.13.4",         # 3.13.3 has 4 CVEs (fixed in 3.13.4)
    "python-dotenv>=1.2.2",    # 1.0.1 has GHSA-mf9w-mj56-hr94 (fixed in 1.2.2)
    "pypdf>=6.10.2",           # 6.1.1 has 12 DoS CVEs (fixed in 6.10.2+)
    "cryptography>=46.0.7",    # GHSA-p423-j2cm-9vmq
    "marshmallow>=3.26.2",     # GHSA-428g-f7cq-pgp5
    "mlx>=0.29.4",             # GHSA-j842/w6vg (fixed in 0.29.4)
    "nltk>=3.9.4",             # GHSA-7p94/gfwx/h8wq (fixed in 3.9.4)
    "pillow>=12.2.0",          # GHSA-cfh3/whj4 (fixed in 12.2.0)
    "protobuf>=6.33.5",        # GHSA-7gcm-g887-7qv7
    "pyjwt>=2.12.0",           # GHSA-752w-5fwx-jx9f
    "azure-core>=1.38.0",      # GHSA-jm66-cg57-jjv5
]

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
]
perf = [
    "memray",
    "py-spy",
    "pytest-benchmark",
    "scalene",
]
